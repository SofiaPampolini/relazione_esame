# specifico la connessione al database dbteatroapp
spring.datasource.url=jdbc:mysql://localhost:3306/dbteatroapp?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Valida la struttura delle entità rispetto alle tabelle SQL esistenti
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Stampa messaggi di errore nelle risposte
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always